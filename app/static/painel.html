<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Painel de Pedidos</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/js/tailwind-config.js"></script>
</head>
<body class="tela-painel min-h-screen overflow-hidden cursor-none">
  <main class="h-screen grid grid-cols-2 grid-rows-[minmax(0,1fr)_auto]">
    <section class="p-12 pb-6 border-r-4 border-borda overflow-hidden">
      <h1 class="fonte-titulo text-laranja mb-4">🔥 Preparando</h1>
      <ul id="preparando" class="grid grid-cols-2 gap-x-8 gap-y-1 fonte-pedido-lista num-pedido"></ul>
    </section>
    <section class="p-12 pb-6 overflow-hidden">
      <h1 class="fonte-titulo text-amarelo mb-4">✅ Pronto</h1>
      <ul id="pronto" class="grid grid-cols-2 gap-x-8 gap-y-1 fonte-pedido-lista num-pedido text-amarelo"></ul>
    </section>
    <footer id="rodape" class="col-span-2 p-6 text-center text-suave text-[32px] border-t-4 border-borda"></footer>
  </main>

  <div id="destaque" hidden class="fixed inset-0 z-20 bg-amarelo text-preto flex flex-col items-center justify-center gap-8">
    <p class="fonte-titulo">✅ Pedido pronto</p>
    <div id="destaque-numero" class="fonte-pedido-painel num-pedido pulsar"></div>
    <p class="fonte-produto">Retire no balcão</p>
  </div>

  <button id="ativar-som" class="fixed inset-0 z-30 bg-preto text-amarelo fonte-titulo cursor-pointer border-0">
    🔊 Toque para ativar o som
  </button>

  <script type="module" src="/static/js/painel.js"></script>
</body>
</html>
